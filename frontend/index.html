<!doctype html>
<html lang="en" class="dark">

  <body class="bg-gray-950 text-gray-50 antialiased">

          violet: '--color-primary-300:196 181 253;--color-primary-400:167 139 250;--color-primary-500:139 92 246;--color-primary-600:124 58 237;--color-primary-700:109 40 217;--color-primary-800:91 33 182;--color-primary-900:76 29 149;--color-primary-950:46 16 101;--color-primary-hex-300:#c4b5fd;--color-primary-hex-400:#a78bfa;--color-primary-hex-500:#8b5cf6;--color-primary-hex-600:#7c3aed;--color-primary-rail:#3b1f6e;--color-primary-signal:#ddd6fe',

          rose:   '--color-primary-300:253 164 175;--color-primary-400:251 113 133;--color-primary-500:244 63 94;--color-primary-600:225 29 72;--color-primary-700:190 18 60;--color-primary-800:159 18 57;--color-primary-900:136 19 55;--color-primary-950:76 5 25;--color-primary-hex-300:#fda4af;--color-primary-hex-400:#fb7185;--color-primary-hex-500:#f43f5e;--color-primary-hex-600:#e11d48;--color-primary-rail:#5a1028;--color-primary-signal:#fecdd3'
        };
        var _t = (JSON.parse(localStorage.getItem('rca_settings') || '{}').theme) || 'indigo';
        var _s = document.createElement('style');
        _s.id = 'rca-theme';
        _s.textContent = ':root{' + (_THEME_VARS[_t] || _THEME_VARS.indigo) + '}';
        document.head.appendChild(_s);
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Capture the install prompt as early as possible — before React mounts.
      window.__pwaInstallPrompt = null
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault()
        window.__pwaInstallPrompt = e
        window.dispatchEvent(new Event('pwa-prompt-ready'))
      })
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
