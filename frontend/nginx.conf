server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── PWA files — never cache so updates reach users immediately ────────
    location ~* ^/(sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        try_files $uri =404;
    }

    # ── Static assets — aggressive cache (filenames are content-hashed) ──
    location ~* \.(?:js|css|woff2?|png|svg|ico|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API proxy → FastAPI backend ───────────────────────────────────────
    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Pass cookies and host so JWT auth and CORS work correctly
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # SSE (Server-Sent Events) — disable buffering so log lines reach the
        # browser in real time instead of being held until the buffer fills.
        proxy_buffering              off;
        proxy_cache                  off;
        proxy_set_header             Connection '';
        chunked_transfer_encoding    on;

        # Keep SSE streams alive; default 60 s would close long analyses.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
