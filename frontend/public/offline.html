<!doctype html>
<!-- Author: Kishore Kumar -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080c10" />
    <title>JobPilot - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; padding: 16px; display: grid; place-items: center; background: radial-gradient(ellipse at top, #292719, transparent 70%), #080c10; color: #f0eee8; font: 14px system-ui, sans-serif; }
      main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #494434; border-radius: 16px; background: #10171b; text-align: center; }
      img { width: 52px; height: 52px; }
      h1 { font: 36px Georgia, serif; letter-spacing: -.03em; }
      p { margin-bottom: 24px; color: #a2ada8; line-height: 1.8; }
      button { min-height: 44px; padding: .8rem 1.3rem; border: 1px solid #e6c997; border-radius: .5rem; background: #e6c997; color: #080c10; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #e6c997; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Reconnect to view live jobs, applications and payment updates. Your account data is not stored offline.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
